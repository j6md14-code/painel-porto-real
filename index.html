<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#01182B">
<meta name="robots" content="noindex,nofollow">
<meta name="format-detection" content="telephone=no">
<title>Painel Porto Real</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Identidade Porto Real: azul-marinho profundo, branco e azul vivo; títulos largos em caixa alta. */
:root{
  color-scheme:dark;
  --navy:#022640; --navy-2:#01182B; --card:#05304F; --card-2:#073A5E; --raised:#0A4369;
  --ink:#F2F7FB; --muted:#9DB4C6; --line:rgba(255,255,255,.14); --line-2:rgba(255,255,255,.08);
  --accent:#2E9BFF; --accent-ink:#021C30; --good:#3BD98E; --bad:#FF7A6B; --warm:#FFC24B;
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 12px 30px rgba(0,10,20,.45);
  --font-display:"Montserrat","Segoe UI",system-ui,sans-serif;
  --font-body:"Manrope",-apple-system,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --r:16px;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--font-body);font-size:15px;line-height:1.5;color:var(--ink);font-variant-numeric:tabular-nums;
  background:radial-gradient(1000px 480px at 85% -10%,rgba(46,155,255,.16),transparent 60%),linear-gradient(170deg,var(--navy) 0%,var(--navy-2) 70%);
  background-attachment:fixed;min-height:100vh;min-height:100dvh}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent);color:var(--accent-ink)}
.wrap{max-width:1100px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}

header.top{position:sticky;top:0;z-index:20;padding-top:var(--top);background:rgba(1,24,43,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line-2)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:12px}
.top img.logo{width:46px;height:46px;flex-shrink:0;filter:drop-shadow(0 4px 12px rgba(0,0,0,.4))}
.brand{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.brand b{font-family:var(--font-display);font-weight:800;font-size:1.05rem;letter-spacing:.12em;white-space:nowrap}
.brand span{font-size:.7rem;text-transform:uppercase;letter-spacing:.22em;color:var(--accent);font-weight:700;white-space:nowrap}
.sync{font-size:.74rem;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 11px;white-space:nowrap}

.btn{border:1px solid var(--line);background:var(--card-2);padding:10px 15px;border-radius:11px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;min-height:40px;color:var(--ink)}
.btn:hover{background:var(--raised)}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.danger{color:var(--bad);border-color:rgba(255,122,107,.5);background:transparent}
.btn.danger.armed{background:var(--bad);color:#2A0B07}
.btn.sm{padding:6px 11px;font-size:.84rem;min-height:34px;border-radius:9px}

main{padding-top:24px;padding-bottom:calc(60px + var(--bot))}
h2.sec{font-family:var(--font-display);font-weight:800;font-size:.86rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink);margin:30px 0 12px;display:flex;align-items:center;gap:10px}
h2.sec::after{content:"";flex:1;height:1px;background:var(--line-2)}
h2.sec .count{background:var(--card-2);border-radius:99px;padding:1px 9px;font-size:.78rem;letter-spacing:0}
.sub{color:var(--muted);font-size:.88rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.loading{color:var(--muted);padding:60px 0;text-align:center}
.hello{margin:0 0 18px}
.hello h1{font-family:var(--font-display);font-weight:800;font-size:clamp(1.3rem,3.6vw,1.9rem);letter-spacing:.04em;margin:0;text-transform:uppercase}
.hello h1 em{color:var(--accent);font-style:normal}
.hello p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:4px 11px;border-radius:99px;background:var(--card-2);color:var(--muted);border:1px solid var(--line-2);white-space:nowrap}
.chip.click{cursor:pointer}
.chip.click:hover{border-color:var(--accent)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{position:relative;background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--line-2);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0;overflow:hidden}
.kpi::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--c,var(--accent))}
.kpi .l{font-size:.68rem;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-weight:800}
.kpi .v{font-family:var(--font-display);font-weight:800;font-size:1.7rem;letter-spacing:-.01em;line-height:1.2;margin-top:6px}
.kpi .h{font-size:.78rem;color:var(--muted);margin-top:3px}
.kpi.main{grid-column:span 1}
.kpi.main .v{color:var(--accent)}

.panel{background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--line-2);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:8px 13px;cursor:pointer;font-weight:700;color:var(--muted);font-size:.86rem;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.chart{width:100%;height:auto;display:block;margin-top:8px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.tablewrap{overflow-x:auto;border:1px solid var(--line-2);border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--line-2);white-space:nowrap}
th{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:800;background:rgba(255,255,255,.04)}
td.num,th.num{text-align:right}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--raised)}
tfoot td{font-weight:800;background:rgba(255,255,255,.04);border-top:1px solid var(--line);border-bottom:0;color:var(--accent)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:26px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.empty .btn{margin-top:12px}

dialog{border:1px solid var(--line);padding:0;border-radius:18px;background:var(--card);color:var(--ink);width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 20px 60px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(0,8,15,.72)}
.dlg{display:flex;flex-direction:column;max-height:inherit}
.dlg header{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line-2)}
.dlg header h3{margin:0;font-family:var(--font-display);font-weight:800;font-size:1rem;letter-spacing:.08em;text-transform:uppercase;margin-right:auto}
.dlg .body{padding:16px 18px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;-webkit-overflow-scrolling:touch}
.dlg .body>*{min-width:0}
.dlg .full{grid-column:1/-1}
.dlg footer{display:flex;gap:8px;padding:12px 18px calc(12px + var(--bot));border-top:1px solid var(--line-2);flex-wrap:wrap}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:.72rem;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.f input,.f select{border:1px solid var(--line);background:var(--navy-2);border-radius:10px;padding:10px 11px;width:100%;min-height:42px}
.f input:focus{border-color:var(--accent);outline:none}
.hint{font-size:.78rem;color:var(--muted)}

.auth{max-width:380px;margin:7vh auto 0;background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--line);border-radius:20px;padding:30px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;text-align:center}
.auth img{width:110px;height:110px;margin:0 auto}
.auth h2{font-family:var(--font-display);font-weight:800;font-size:1.15rem;letter-spacing:.14em;margin:0;text-transform:uppercase}
.auth p{margin:-6px 0 0;color:var(--muted);font-size:.85rem}
.auth .f{text-align:left}
.auth .err{color:var(--bad);font-weight:700;font-size:.88rem}
.toast{position:fixed;left:50%;bottom:calc(28px + var(--bot));transform:translateX(-50%);background:var(--accent);color:#fff;padding:11px 18px;border-radius:14px;font-weight:700;font-size:.9rem;z-index:60;max-width:min(440px,calc(100vw - 32px));text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
footer.rodape{margin-top:40px;text-align:center;color:var(--muted);font-size:.76rem;letter-spacing:.14em;text-transform:uppercase}
input[type="date"]{color-scheme:dark;-webkit-appearance:none;appearance:none;text-align:left}
@media (max-width:760px){
  .brand b{font-size:.95rem}
  .kpi .v{font-size:1.4rem}
  .dlg .body{grid-template-columns:1fr}
  dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:20px 20px 0 0;border-bottom:0;max-height:92dvh}
  input,select{font-size:16px!important}
}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .2s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <img class="logo" src="logo.png" alt="Porto Real Imóveis">
    <div class="brand"><b>PORTO REAL</b><span>Painel de tráfego</span></div>
    <span class="sync" id="syncInfo" hidden>Conectando…</span>
    <button class="btn sm" id="btnSair" type="button" hidden>Sair</button>
  </div>
</header>

<main class="wrap" id="app"><div class="loading">Carregando…</div></main>

<dialog id="dlg"><form class="dlg" id="dlgForm" method="dialog" novalidate></form></dialog>
<div id="toastHost" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";
/* ====== CONFIGURAÇÃO (já preenchida para o projeto carteira-jm) ====== */
const SUPABASE_URL = "https://jtrzgwdtutoawqfgwezc.supabase.co";
const SUPABASE_KEY = "sb_publishable_bTT3fE5WZdfg5RE0CB2Fkw_6nqVb3Pn";
/* ===================================================================== */
const DOMINIO="carteirajm.local";
const ADMINS=["joaomatheus@"+DOMINIO,"joao@"+DOMINIO];
const INICIO_PADRAO="2026-07-23";

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=n=>(Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:2});
const brl0=n=>(Number(n)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:0});
const pad=n=>String(n).padStart(2,"0");
const hoje=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const fmtData=s=>{if(!s)return"";const [y,m,d]=s.slice(0,10).split("-");return d+"/"+m+(y!==String(new Date().getFullYear())?"/"+y.slice(2):"")};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const paraEmail=u=>{u=String(u||"").trim().toLowerCase();return u.includes("@")?u:u.replace(/\s+/g,"")+"@"+DOMINIO};

const state={gastos:[],vendas:[],config:{},ready:false};
let sb=null,sessao=null,admin=false,grafPeriodo="30";
const dataInicio=()=>state.config.dataInicio||INICIO_PADRAO;

/* ---------- Toast ---------- */
let toastT;
function toast(msg){document.querySelectorAll(".toast").forEach(t=>t.remove());const h=$("#dlg").open?$("#dlgForm"):$("#toastHost");h.insertAdjacentHTML("beforeend",'<div class="toast" role="status">'+esc(msg)+'</div>');clearTimeout(toastT);toastT=setTimeout(()=>document.querySelectorAll(".toast").forEach(t=>t.remove()),2800)}

/* ---------- Dados ---------- */
async function carregar(){
  const linhas=[]; let de=0;
  while(true){
    const {data,error}=await sb.from("painel").select("id,colecao,dados").range(de,de+999);
    if(error){$("#syncInfo").textContent="Sem conexão";toast("Não foi possível carregar: "+error.message);return}
    linhas.push(...data); if(data.length<1000)break; de+=1000;
  }
  state.gastos=[];state.vendas=[];state.config={};
  linhas.forEach(r=>{
    if(r.colecao==="config"){if(r.id==="metaSync")state.config.metaSync=r.dados;else Object.assign(state.config,r.dados||{});return}
    if(r.colecao==="gastos")state.gastos.push(Object.assign({id:r.id},r.dados));
    if(r.colecao==="vendas")state.vendas.push(Object.assign({id:r.id},r.dados));
  });
  state.ready=true; $("#syncInfo").textContent="Atualizado"; render();
}
async function gravar(colecao,id,dados){
  const {error}=await sb.from("painel").upsert({id,colecao,dados,atualizado_em:new Date().toISOString()},{onConflict:"id"});
  if(error){toast(navigator.onLine?"Não salvou: "+error.message:"Sem internet.");throw error}
}
async function excluir(id){
  const {error}=await sb.from("painel").delete().eq("id",id);
  if(error){toast("Não foi possível excluir.");throw error}
}

/* ---------- Login ---------- */
function telaLogin(){
  $("#syncInfo").hidden=true;$("#btnSair").hidden=true;
  $("#app").innerHTML='<form class="auth" id="authForm"><img src="logo.png" alt=""><h2>Painel de Tráfego</h2><p>Meta Ads · Porto Real Imóveis</p>'+
    '<div class="f"><label for="aUser">Usuário</label><input id="aUser" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="ex.: porto real" required></div>'+
    '<div class="f"><label for="aSenha">Senha</label><input id="aSenha" type="password" autocomplete="current-password" required></div>'+
    '<div id="aMsg"></div><button class="btn primary" type="submit">Entrar</button></form>';
  $("#authForm").onsubmit=async e=>{
    e.preventDefault(); const b=$("#authForm .primary"); b.disabled=true; b.textContent="Entrando…";
    const {error}=await sb.auth.signInWithPassword({email:paraEmail($("#aUser").value),password:$("#aSenha").value});
    b.disabled=false; b.textContent="Entrar";
    if(error)$("#aMsg").innerHTML='<p class="err">'+(navigator.onLine?"Usuário ou senha incorretos.":"Sem internet.")+'</p>';
  };
}
async function init(){
  if(!window.supabase){$("#app").innerHTML='<div class="loading">Não foi possível carregar. Verifique a internet e recarregue.</div>';return}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:"painel-pr-auth"}});
  sb.auth.onAuthStateChange((ev,s)=>{
    if(s){sessao=s;admin=ADMINS.includes(String(s.user.email).toLowerCase());
      $("#syncInfo").hidden=false;$("#btnSair").hidden=false;
      $("#app").innerHTML='<div class="loading">Carregando…</div>';setTimeout(carregar,0)}
    else{sessao=null;admin=false;state.ready=false;setTimeout(telaLogin,0)}
  });
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&sessao)carregar()});
  $("#btnSair").onclick=()=>sb.auth.signOut();
}

/* ---------- Cálculos ---------- */
function gastosPeriodo(){const d0=dataInicio();return state.gastos.filter(g=>(g.data||"")>=d0).sort((a,b)=>(a.data||"").localeCompare(b.data||""))}
function totais(){
  const gs=gastosPeriodo();
  const gasto=gs.reduce((s,g)=>s+(Number(g.valor)||0),0);
  const leads=gs.reduce((s,g)=>s+(Number(g.leads)||0),0);
  const vendas=state.vendas.length;
  const vendido=state.vendas.reduce((s,v)=>s+(Number(v.valor)||0),0);
  return{gasto,leads,cpl:leads?gasto/leads:NaN,vendas,cpv:vendas?gasto/vendas:NaN,vendido};
}

/* ---------- Gráfico (barras de gasto + linha de leads) ---------- */
function grafico(){
  const porDia={};
  gastosPeriodo().forEach(g=>{const d=(g.data||"").slice(0,10);if(!d)return;porDia[d]=porDia[d]||{v:0,l:0};porDia[d].v+=Number(g.valor)||0;porDia[d].l+=Number(g.leads)||0});
  let dias=Object.keys(porDia).sort();
  if(grafPeriodo==="30")dias=dias.slice(-30);
  if(!dias.length)return'<p class="sub" style="margin:8px 0 0">Sem dados ainda. Clique em "Atualizar do Meta" para importar.</p>';
  const W=1000,H=300,L=56,R=44,T=16,B=34,iw=W-L-R,ih=H-T-B;
  const maxV=Math.max(1,...dias.map(d=>porDia[d].v)),maxL=Math.max(1,...dias.map(d=>porDia[d].l));
  const bw=Math.min(26,iw/dias.length*.72),step=iw/dias.length;
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Gasto e leads por dia">';
  for(let i=0;i<=3;i++){const y=T+ih-ih*i/3;s+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="rgba(255,255,255,.08)"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="12" fill="#9DB4C6">'+brl0(maxV*i/3)+'</text>'}
  dias.forEach((d,i)=>{
    const x=L+step*i+step/2,v=porDia[d].v,h=v/maxV*ih;
    s+='<rect x="'+(x-bw/2).toFixed(1)+'" y="'+(T+ih-h).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="3" fill="#2E9BFF" opacity=".9"><title>'+fmtData(d)+" · "+brl(v)+" · "+porDia[d].l+' leads</title></rect>';
  });
  const pts=dias.map((d,i)=>(L+step*i+step/2).toFixed(1)+","+(T+ih-porDia[d].l/maxL*ih).toFixed(1)).join(" ");
  s+='<polyline points="'+pts+'" fill="none" stroke="#3BD98E" stroke-width="2.5" stroke-linejoin="round"/>';
  dias.forEach((d,i)=>{s+='<circle cx="'+(L+step*i+step/2).toFixed(1)+'" cy="'+(T+ih-porDia[d].l/maxL*ih).toFixed(1)+'" r="3" fill="#3BD98E"><title>'+fmtData(d)+" · "+porDia[d].l+' leads</title></circle>'});
  const cada=Math.max(1,Math.ceil(dias.length/8));
  dias.forEach((d,i)=>{if(i%cada===0||i===dias.length-1)s+='<text x="'+(L+step*i+step/2).toFixed(1)+'" y="'+(H-10)+'" text-anchor="middle" font-size="12" fill="#9DB4C6">'+fmtData(d)+'</text>'});
  for(let i=0;i<=3;i++){const y=T+ih-ih*i/3;s+='<text x="'+(W-R+8)+'" y="'+(y+4)+'" text-anchor="start" font-size="12" fill="#3BD98E">'+Math.round(maxL*i/3)+'</text>'}
  s+='</svg>';
  return s+'<div class="legend"><span><i style="background:#2E9BFF"></i>Investimento por dia</span><span><i style="background:#3BD98E"></i>Leads por dia</span></div>';
}

/* ---------- Render ---------- */
function render(){
  if(!sessao||!state.ready)return;
  const t=totais(); const ms=state.config.metaSync;
  const qd=ms?new Date(ms.em).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
  let h='<div class="hello"><div class="row"><div><h1>Resultados de <em>tráfego</em></h1><p>Meta Ads · desde '+fmtData(dataInicio())+' · atualização automática 3× ao dia</p></div><span class="spacer"></span>'+
    '<span class="chip'+(admin?" click":"")+'"'+(admin?' id="chipInicio" role="button" tabindex="0" title="Alterar data inicial"':'')+'>Desde '+fmtData(dataInicio())+(admin?" ✎":"")+'</span>'+
    (admin?'':'<span class="chip"><span class="dot"></span>Visualização</span>')+'</div></div>';

  h+='<div class="kpis">'+
    kpi("var(--accent)","Investimento total",brl(t.gasto),"em anúncios desde "+fmtData(dataInicio()),true)+
    kpi("#3BD98E","Leads gerados",t.leads,"conversas iniciadas")+
    kpi("#FFC24B","Custo por lead",isFinite(t.cpl)?brl(t.cpl):"—","investimento ÷ leads")+
    kpi("#9F8CFF","Vendas",t.vendas,(t.vendido?brl0(t.vendido)+" vendidos":"registradas no painel"))+
    kpi("#FF8BC2","Custo por venda",isFinite(t.cpv)?brl(t.cpv):"—","investimento ÷ vendas")+
  '</div>';

  h+='<div class="panel" style="margin-top:14px"><div class="row"><b style="font-family:var(--font-display);letter-spacing:.08em;font-size:.82rem">META ADS</b><span class="sub">'+(ms?((ms.ok?"Sincronizado em ":"Falhou em ")+qd+(ms.mensagem?" · "+esc(ms.mensagem):"")):"Ainda não sincronizado")+'</span><span class="spacer"></span>'+
    (admin?'<button class="btn sm" type="button" data-act="gasto">+ Lançamento manual</button><button class="btn sm primary" type="button" data-act="sync">Atualizar do Meta</button>':'')+'</div></div>';

  h+='<h2 class="sec">Investimento diário</h2><div class="panel"><div class="row"><span class="sub">Gasto em anúncios e leads, dia a dia</span><span class="spacer"></span><div class="seg" role="group">'+
    [["30","Últimos 30 dias"],["tudo","Desde o início"]].map(p=>'<button type="button" data-gper="'+p[0]+'" aria-pressed="'+(grafPeriodo===p[0])+'">'+p[1]+'</button>').join("")+'</div></div>'+grafico()+'</div>';

  const manuais=state.gastos.filter(g=>g.origem!=="meta").sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  if(manuais.length){
    h+='<h2 class="sec">Lançamentos manuais <span class="count">'+manuais.length+'</span></h2><div class="tablewrap"><table><thead><tr><th>Data</th><th>Descrição</th><th class="num">Valor</th><th class="num">Leads</th></tr></thead><tbody>'+
      manuais.map(g=>'<tr'+(admin?' class="click" data-edit-gasto="'+esc(g.id)+'"':'')+'><td>'+fmtData(g.data)+'</td><td>'+esc(g.descricao||"—")+'</td><td class="num">'+brl(g.valor)+'</td><td class="num">'+(Number(g.leads)||0)+'</td></tr>').join("")+'</tbody></table></div>';
  }

  const vs=[...state.vendas].sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  h+='<h2 class="sec">Vendas <span class="count">'+vs.length+'</span>'+(admin?'<button class="btn sm primary" type="button" data-act="venda" style="margin-left:auto">+ Registrar venda</button>':'')+'</h2>';
  if(!vs.length)h+='<div class="empty"><b>Nenhuma venda registrada</b>'+(admin?'Registre cada venda para o painel calcular o custo por venda.<br><button class="btn primary" type="button" data-act="venda">Registrar venda</button>':'As vendas registradas aparecem aqui.')+'</div>';
  else{
    h+='<div class="tablewrap"><table><thead><tr><th>Data</th><th>Descrição</th><th class="num">Valor da venda</th></tr></thead><tbody>'+
      vs.map(v=>'<tr'+(admin?' class="click" data-edit-venda="'+esc(v.id)+'"':'')+'><td>'+fmtData(v.data)+'</td><td>'+esc(v.descricao||"—")+'</td><td class="num">'+(v.valor?brl0(v.valor):"—")+'</td></tr>').join("")+
      '</tbody><tfoot><tr><td colspan="2">'+vs.length+' venda'+(vs.length>1?"s":"")+' · custo por venda</td><td class="num">'+(isFinite(t.cpv)?brl(t.cpv):"—")+'</td></tr></tfoot></table></div>';
  }
  h+='<footer class="rodape">Porto Real Imóveis · Rio Claro/SP</footer>';
  $("#app").innerHTML=h;

  document.querySelectorAll("[data-gper]").forEach(b=>b.onclick=()=>{grafPeriodo=b.dataset.gper;render()});
  document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>acao(b.dataset.act,b));
  if(admin){
    const ci=$("#chipInicio"); if(ci){ci.onclick=abrirConfig;ci.onkeydown=e=>{if(e.key==="Enter")abrirConfig()}}
    document.querySelectorAll("[data-edit-venda]").forEach(r=>r.onclick=()=>abrirVenda(r.dataset.editVenda));
    document.querySelectorAll("[data-edit-gasto]").forEach(r=>r.onclick=()=>abrirGasto(r.dataset.editGasto));
  }
}
function kpi(cor,l,v,h,main){return'<div class="kpi'+(main?" main":"")+'" style="--c:'+cor+'"><div class="l">'+esc(l)+'</div><div class="v">'+esc(String(v))+'</div><div class="h">'+esc(h)+'</div></div>'}

async function acao(a,btn){
  if(a==="venda")abrirVenda();
  else if(a==="gasto")abrirGasto();
  else if(a==="sync"){
    btn.disabled=true;btn.textContent="Buscando no Meta…";
    try{
      const {data,error}=await sb.functions.invoke("painel-sync",{body:{}});
      if(error){let msg=error.message||"erro";try{const j=await error.context.json();if(j&&j.erro)msg=j.erro}catch(e){}
        toast(/not found|404|Failed to send/i.test(msg)?"A função painel-sync ainda não foi instalada no Supabase.":"Não atualizou: "+msg)}
      else{toast(data&&data.mensagem?data.mensagem:"Atualizado");await carregar()}
    }finally{if(btn.isConnected){btn.disabled=false;btn.textContent="Atualizar do Meta"}}
  }
}

/* ---------- Diálogos ---------- */
const dlg=$("#dlg"),form=$("#dlgForm");
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():""};
function abrirDialogo(titulo,corpo,onSave,onDelete){
  form.innerHTML='<header><h3>'+esc(titulo)+'</h3><button class="btn ghost sm" type="button" data-close>Fechar</button></header><div class="body">'+corpo+'</div><footer>'+(onDelete?'<button class="btn danger" type="button" data-del>Excluir</button>':'')+'<span class="spacer"></span><button class="btn" type="button" data-close>Cancelar</button><button class="btn primary" type="submit">Salvar</button></footer>';
  form.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>dlg.close());
  const del=form.querySelector("[data-del]");
  if(del){let armed=false;del.onclick=async()=>{if(!armed){armed=true;del.classList.add("armed");del.textContent="Confirmar exclusão";setTimeout(()=>{armed=false;if(del.isConnected){del.classList.remove("armed");del.textContent="Excluir"}},4000);return}try{await onDelete();dlg.close();toast("Excluído");await carregar()}catch(e){}}}
  form.onsubmit=async e=>{e.preventDefault();const b=form.querySelector('[type="submit"]');b.disabled=true;try{const ok=await onSave();if(ok!==false){dlg.close();await carregar()}}catch(err){}finally{b.disabled=false}};
  if(!dlg.open)dlg.showModal();
}
function abrirVenda(id){
  const v=id?state.vendas.find(x=>x.id===id):null; const d=v||{data:hoje()};
  abrirDialogo(v?"Editar venda":"Registrar venda",
    '<div class="f"><label for="vData">Data</label><input id="vData" type="date" value="'+esc(d.data||hoje())+'"></div>'+
    '<div class="f"><label for="vValor">Valor da venda (R$)</label><input id="vValor" type="number" inputmode="decimal" min="0" value="'+esc(d.valor??"")+'" placeholder="300000"></div>'+
    '<div class="f full"><label for="vDesc">Descrição</label><input id="vDesc" type="text" value="'+esc(d.descricao||"")+'" placeholder="Ex.: Apto Jardim Itapuã · cliente Maria"></div>'+
    '<p class="hint full" style="margin:0">O valor é opcional — o custo por venda usa só a quantidade de vendas.</p>',
    async()=>{
      const desc=val("vDesc"); if(!desc){toast("Descreva a venda");$("#vDesc").focus();return false}
      await gravar("vendas",v?v.id:"v-"+uid(),{data:val("vData")||hoje(),descricao:desc,valor:Number(String(val("vValor")).replace(",","."))||0});
      toast(v?"Venda atualizada":"Venda registrada");
    }, v?()=>excluir(v.id):null);
}
function abrirGasto(id){
  const g=id?state.gastos.find(x=>x.id===id):null; const d=g||{data:hoje()};
  abrirDialogo(g?"Editar lançamento":"Lançamento manual",
    '<div class="f"><label for="gData">Data</label><input id="gData" type="date" value="'+esc(d.data||hoje())+'"></div>'+
    '<div class="f"><label for="gValor">Valor gasto (R$)</label><input id="gValor" type="number" inputmode="decimal" min="0" step="0.01" value="'+esc(d.valor??"")+'"></div>'+
    '<div class="f"><label for="gLeads">Leads</label><input id="gLeads" type="number" inputmode="numeric" min="0" value="'+esc(d.leads??"")+'"></div>'+
    '<div class="f"><label for="gDesc">Descrição</label><input id="gDesc" type="text" value="'+esc(d.descricao||"")+'" placeholder="Ex.: impulsionamento"></div>'+
    '<p class="hint full" style="margin:0">Use só para gastos fora do Meta. Os do Meta entram sozinhos.</p>',
    async()=>{
      await gravar("gastos",g?g.id:"manual-"+uid(),{data:val("gData")||hoje(),descricao:val("gDesc"),valor:Number(String(val("gValor")).replace(",","."))||0,leads:Number(val("gLeads"))||0,origem:"manual"});
      toast(g?"Lançamento atualizado":"Lançamento salvo");
    }, g?()=>excluir(g.id):null);
}
function abrirConfig(){
  abrirDialogo("Data inicial do painel",
    '<div class="f full"><label for="cIni">Contar gastos a partir de</label><input id="cIni" type="date" value="'+esc(dataInicio())+'"></div>'+
    '<p class="hint full" style="margin:0">Os totais e o gráfico consideram os anúncios a partir desta data.</p>',
    async()=>{const v=val("cIni");if(!v)return false;await gravar("config","geral",{dataInicio:v});toast("Data inicial salva")},null);
}

init();
})();
</script>
</body>
</html>
